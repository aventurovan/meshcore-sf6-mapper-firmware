
; ---------------------------------------------------------------
; SF6 Mapper - samodzielny tracker mapujacy (MeshCore Poludnie)
; (dopisywane przez workflow do variants/wio-tracker-l1/platformio.ini)
; ---------------------------------------------------------------
[env:WioTrackerL1_sf6_mapper]
extends = WioTrackerL1
build_flags = ${WioTrackerL1.build_flags}
  -I examples/sf6_mapper
  -D DISPLAY_CLASS=SH1106Display
  -D PIN_BUZZER=12
  -D ENV_SKIP_GPS_DETECT=1
  -D PERSISTANT_GPS=1
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/sf6_mapper/*.cpp>
lib_deps = ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3
  end2endzone/NonBlockingRTTTL@^1.3.0

; ---------------------------------------------------------------
; Companion + SF6 Mapper — companion MeshCore z mapowaniem bez telefonu
; ---------------------------------------------------------------
[env:WioTrackerL1_companion_mapper_ble]
extends = WioTrackerL1
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_unflags = -D LORA_SF=8   ; domyślnie preset SF6 (869,618 · BW 62,5 · SF6)
build_flags = ${WioTrackerL1.build_flags}
  -I examples/companion_mapper
  -I examples/companion_mapper/ui-sf6
  -D LORA_SF=6
  -D MAX_CONTACTS=500
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SH1106Display
  -D UI_HAS_JOYSTICK=1
  -D PIN_BUZZER=12
  -D QSPIFLASH=1
  -D ADVERT_NAME='"@@MAC"'
  -D ENV_PIN_SDA=PIN_WIRE1_SDA
  -D ENV_PIN_SCL=PIN_WIRE1_SCL
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_mapper/*.cpp>
  +<../examples/companion_mapper/ui-sf6/*.cpp>
lib_deps = ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; ---------------------------------------------------------------
; Companion + SF6 Mapper — LilyGO T-Echo (e-papier, 1 przycisk)
; ---------------------------------------------------------------
[env:LilyGo_T-Echo_companion_mapper_ble]
extends = LilyGo_T-Echo
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags = -D LORA_SF=8   ; domyślnie preset SF6 (869,618 · BW 62,5 · SF6)
build_flags =
  ${LilyGo_T-Echo.build_flags}
  -I src/helpers/ui
  -I examples/companion_mapper
  -I examples/companion_mapper/ui-new
  -D LORA_SF=6
  -D MAX_CONTACTS=500
  -D MAX_GROUP_CHANNELS=40
  -D QSPIFLASH=1
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D UI_RECENT_LIST_SIZE=9
  -D UI_SENSORS_PAGE=1
  -D UI_GPS_PAGE=1
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
build_src_filter = ${LilyGo_T-Echo.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_mapper/*.cpp>
  +<../examples/companion_mapper/ui-new/*.cpp>
lib_deps =
  ${LilyGo_T-Echo.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ---------------------------------------------------------------
; Companion + SF6 Mapper — LilyGO T-Echo BEZ EKRANU (np. uszkodzony e-papier)
; Staly PIN Bluetooth 123456 (bez ekranu nie da sie odczytac losowego PIN-u),
; mapper sterowany z aplikacji Mapper SF6 (karta „SF6 Mapper w companionie”).
; ---------------------------------------------------------------
[env:LilyGo_T-Echo_companion_mapper_ble_noscreen]
extends = LilyGo_T-Echo
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags = -D DISPLAY_CLASS=GxEPDDisplay -D LORA_SF=8
build_flags =
  ${LilyGo_T-Echo.build_flags}
  -I examples/companion_mapper
  -D LORA_SF=6
  -D MAX_CONTACTS=500
  -D MAX_GROUP_CHANNELS=40
  -D QSPIFLASH=1
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
build_src_filter = ${LilyGo_T-Echo.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_mapper/*.cpp>
lib_deps =
  ${LilyGo_T-Echo.lib_deps}
  densaugeo/base64 @ ~1.4.0
