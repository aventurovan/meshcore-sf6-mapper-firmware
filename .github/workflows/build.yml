name: Build SF6 Mapper (Wio Tracker L1)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  release:
    types: [ published ]   # nowe wydanie z numerem wersji: build i dołączenie plików .uf2

env:
  # wersja MeshCore, na ktorej budujemy (zmien, zeby przejsc na nowsza)
  MESHCORE_REF: a366955cb2f67b8e6842d4f00d2b6a554dddd88a

permissions:
  contents: write   # publikacja plików .uf2 w wydaniu „Najnowszy build”

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod mappera
        uses: actions/checkout@v4
        with:
          path: mapper

      - name: Pobierz MeshCore
        uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: ${{ env.MESHCORE_REF }}
          path: MeshCore

      - name: Wstaw mapper do MeshCore
        run: |
          mkdir -p MeshCore/examples/sf6_mapper
          cp mapper/sf6_mapper/* MeshCore/examples/sf6_mapper/
          cp -r mapper/companion_mapper MeshCore/examples/
          cat mapper/platformio-sf6.ini >> MeshCore/variants/wio-tracker-l1/platformio.ini

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ env.MESHCORE_REF }}

      - name: Zainstaluj PlatformIO
        run: pip install -U platformio

      - name: Buduj
        working-directory: MeshCore
        run: |
          pio run -e WioTrackerL1_sf6_mapper -e WioTrackerL1_companion_mapper_ble -e LilyGo_T-Echo_companion_mapper_ble
          for E in WioTrackerL1_sf6_mapper WioTrackerL1_companion_mapper_ble LilyGo_T-Echo_companion_mapper_ble; do
            python3 bin/uf2conv/uf2conv.py .pio/build/$E/firmware.hex -c -o .pio/build/$E/firmware.uf2 -f 0xADA52840
          done

      - name: Zbierz pliki
        run: |
          VER=$(grep -oP 'MAPPER_FW_VERSION\s+"\K[^"]+' mapper/sf6_mapper/MapperProtocol.h)
          mkdir -p out
          cp MeshCore/.pio/build/WioTrackerL1_sf6_mapper/firmware.uf2 out/SF6Mapper-WioTrackerL1-$VER.uf2
          cp MeshCore/.pio/build/WioTrackerL1_sf6_mapper/firmware.zip out/SF6Mapper-WioTrackerL1-$VER-ota.zip 2>/dev/null || true
          cp MeshCore/.pio/build/WioTrackerL1_companion_mapper_ble/firmware.uf2 out/Companion-SF6Mapper-WioTrackerL1-$VER.uf2
          cp MeshCore/.pio/build/WioTrackerL1_companion_mapper_ble/firmware.zip out/Companion-SF6Mapper-WioTrackerL1-$VER-ota.zip 2>/dev/null || true
          cp MeshCore/.pio/build/LilyGo_T-Echo_companion_mapper_ble/firmware.uf2 out/Companion-SF6Mapper-T-Echo-$VER.uf2
          cp MeshCore/.pio/build/LilyGo_T-Echo_companion_mapper_ble/firmware.zip out/Companion-SF6Mapper-T-Echo-$VER-ota.zip 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: SF6Mapper-WioTrackerL1
          path: out/

      # Pliki do pobrania pojedynczo (bez ZIP-a, który Chrome potrafi blokować):
      # wydanie „Najnowszy build” (tag „latest-build”) jest nadpisywane przy każdym buildzie z gałęzi main.
      - name: Opublikuj w wydaniu „Najnowszy build”
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd mapper
          VER=$(grep -oP 'MAPPER_FW_VERSION\s+"\K[^"]+' sf6_mapper/MapperProtocol.h)
          NOTES="Automatyczny build z gałęzi main (wersja $VER, commit ${GITHUB_SHA::7}). Pliki .uf2 przeciągnij na dysk urządzenia po podwójnym resecie."
          if ! gh release view latest-build >/dev/null 2>&1; then
            gh release create latest-build --prerelease --title "Najnowszy build" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            git tag -f latest-build "$GITHUB_SHA" && git push -f origin latest-build
            gh release edit latest-build --title "Najnowszy build ($VER)" --notes "$NOTES" --prerelease
            for a in $(gh release view latest-build --json assets -q '.assets[].name'); do gh release delete-asset latest-build "$a" -y; done
          fi
          gh release upload latest-build ../out/* --clobber

      - name: Dołącz pliki do wydania
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd mapper
          gh release upload "${{ github.event.release.tag_name }}" ../out/* --clobber
